workflows:
  ios-browserstack:
    name: Moodle App - iOS IPA + BrowserStack
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      node: 18.18.2
      vars:
        BROWSERSTACK_USERNAME: "paulmwaniki_cvubBk"
        BROWSERSTACK_ACCESS_TOKEN: "GnDb7oSPmJx1RNDJNy2x"
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Check Node version
        script: |
          node -v && npm -v

      - name: Bypass engine check
        script: |
          sed -i '' 's/engine-strict=true/engine-strict=false/g' .npmrc || true
          npm config set engine-strict false

      - name: Install dependencies
        script: |
          npm ci

      - name: Install Ionic + Cordova CLIs
        script: |
          npm install -g @ionic/cli cordova

      - name: Build cordova-plugin-moodleapp
        script: |
          npm run prod --prefix cordova-plugin-moodleapp

      - name: Run gulp (generate www/)
        script: |
          NODE_ENV=production npx gulp

      - name: Clean stale Cordova artefacts
        script: |
          rm -rf platforms plugins .angular

      - name: Add iOS platform
        script: |
          ionic cordova platform remove ios --nosave || true
          ionic cordova platform add ios \
            --confirm \
            --no-interactive \
            --noresources

      - name: CocoaPods install
        script: |
          cd platforms/ios && pod install --repo-update

      - name: Create self-signed identity for building
        script: |
          # Allows xcodebuild to produce a complete .app bundle without a real cert
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings build.keychain

          # Generate a temporary self-signed certificate
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem \
            -out /tmp/cert.pem -days 1 -nodes \
            -subj "/CN=iPhone Developer/O=Test/C=US"
          openssl pkcs12 -export -inkey /tmp/key.pem -in /tmp/cert.pem \
            -out /tmp/dev.p12 -passout pass:""
          security import /tmp/dev.p12 -k build.keychain \
            -P "" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Build iOS .app (device build, ad-hoc signing)
        script: |
          cd platforms/ios
          xcodebuild \
            -workspace Moodle.xcworkspace \
            -scheme Moodle \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee /tmp/xcodebuild.log

          # Verify Info.plist is present before packaging
          APP=$(find build -name "Moodle.app" -not -name "*.dSYM" | head -1)
          echo "App path: $APP"
          ls "$APP/Info.plist" && echo "Info.plist OK" \
            || (echo "MISSING Info.plist — build incomplete" && exit 1)

      - name: Package .app into .ipa
        script: |
          APP=$(find platforms/ios/build -name "Moodle.app" \
            -not -name "*.dSYM" | head -1)
          echo "Packaging: $APP"

          rm -rf /tmp/ipawork
          mkdir -p /tmp/ipawork/Payload
          cp -r "$APP" /tmp/ipawork/Payload/Moodle.app

          cd /tmp/ipawork
          zip -r /tmp/Moodle.ipa Payload
          ls -lh /tmp/Moodle.ipa

      - name: Upload IPA to BrowserStack App Live
        script: |
          RESPONSE=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_TOKEN" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@/tmp/Moodle.ipa")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "app_url" \
            || (echo "Upload failed" && exit 1)

    artifacts:
      - /tmp/Moodle.ipa
      - /tmp/xcodebuild.log
