workflows:
  ios-browserstack:
    name: Moodle App - iOS IPA + BrowserStack
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      node: 18.18.2
      vars:
        BROWSERSTACK_USERNAME: "paulmwaniki_cvubBk"
        BROWSERSTACK_ACCESS_TOKEN: "GnDb7oSPmJx1RNDJNy2x"
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Check Node version
        script: |
          node -v && npm -v

      - name: Bypass engine check
        script: |
          sed -i '' 's/engine-strict=true/engine-strict=false/g' .npmrc || true
          npm config set engine-strict false

      - name: Install dependencies
        script: |
          npm ci

      - name: Install Ionic + Cordova CLIs
        script: |
          npm install -g @ionic/cli cordova

      - name: Build cordova-plugin-moodleapp
        script: |
          npm run prod --prefix cordova-plugin-moodleapp

      - name: Run gulp (generate www/)
        script: |
          NODE_ENV=production npx gulp

      - name: Clean stale Cordova artefacts
        script: |
          rm -rf platforms plugins .angular

      - name: Add iOS platform
        script: |
          ionic cordova platform remove ios --nosave || true
          ionic cordova platform add ios \
            --confirm \
            --no-interactive \
            --noresources

      - name: CocoaPods install
        script: |
          cd platforms/ios && pod install --repo-update

      - name: Build iOS .app (simulator — no signing required)
        script: |
          cd platforms/ios
          xcodebuild \
            -workspace Moodle.xcworkspace \
            -scheme Moodle \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            | tee /tmp/xcodebuild.log

      - name: Debug — find and inspect .app bundles
        script: |
          echo "=== All .app bundles found ==="
          find platforms/ios/build -name "*.app" -not -name "*.dSYM"

          echo ""
          echo "=== Top-level contents of each .app ==="
          find platforms/ios/build -name "*.app" -not -name "*.dSYM" | while read app; do
            echo "--- $app ---"
            ls -la "$app" | head -30
            echo ""
          done

      - name: Package .app into .ipa
        script: |
          # Find only the top-level Moodle.app, not nested ones inside PlugIns/
          APP=$(find platforms/ios/build -name "Moodle.app" \
            -not -name "*.dSYM" \
            -not -path "*/PlugIns/*" \
            -not -path "*/Watch/*" \
            | head -1)

          echo "Packaging: $APP"
          echo "App size: $(du -sh "$APP")"
          echo "Info.plist check:"
          ls -la "$APP/Info.plist" || (echo "MISSING Info.plist" && exit 1)

          rm -rf /tmp/ipawork
          mkdir -p /tmp/ipawork/Payload
          cp -r "$APP" /tmp/ipawork/Payload/Moodle.app

          cd /tmp/ipawork
          zip -r /tmp/Moodle.ipa Payload
          ls -lh /tmp/Moodle.ipa

          echo ""
          echo "=== IPA zip listing (first 40 entries) ==="
          unzip -l /tmp/Moodle.ipa | head -40

          echo ""
          echo "=== Verifying Info.plist inside IPA ==="
          unzip -l /tmp/Moodle.ipa | grep -i "info.plist" \
            || (echo "Info.plist NOT found inside IPA" && exit 1)

      - name: Upload IPA to BrowserStack App Live
        script: |
          RESPONSE=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_TOKEN" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@/tmp/Moodle.ipa")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "app_url" \
            || (echo "Upload failed" && exit 1)

    artifacts:
      - /tmp/Moodle.ipa
      - /tmp/xcodebuild.log
