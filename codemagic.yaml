workflows:
  ios-simulator-browserstack:
    name: Moodle App - Build + BrowserStack
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      node: 18.18.2
      vars:
        BROWSERSTACK_USERNAME: "paulmwaniki_cvubBk"
        BROWSERSTACK_ACCESS_TOKEN: "GnDb7oSPmJx1RNDJNy2x"
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
        - $HOME/Library/Caches/CocoaPods   # cache pod downloads
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Check Node version
        script: |
          node -v
          npm -v

      - name: Bypass engine check
        script: |
          sed -i '' 's/engine-strict=true/engine-strict=false/g' .npmrc || true
          npm config set engine-strict false

      - name: Install dependencies
        script: |
          npm ci

      - name: Install Ionic + Cordova CLIs
        script: |
          npm install -g @ionic/cli cordova

      - name: Build cordova-plugin-moodleapp
        script: |
          npm run prod --prefix cordova-plugin-moodleapp

      - name: Run gulp (generate www/)
        script: |
          NODE_ENV=production npx gulp

      - name: Clean stale Cordova artefacts
        script: |
          rm -rf platforms plugins .angular

      - name: Add iOS platform
        script: |
          # --noresources avoids LD_RUNPATH_SEARCH_PATHS conflict with CocoaPods
          # --no-interactive / --confirm prevent prompts hanging the build
          ionic cordova platform remove ios --nosave || true
          ionic cordova platform add ios \
            --confirm \
            --no-interactive \
            --noresources

      - name: CocoaPods install
        script: |
          # Run separately so errors surface clearly instead of hiding in ionic cordova build
          cd platforms/ios
          pod install --repo-update

      - name: Build iOS for simulator (no signing)
        script: |
          cd platforms/ios
          xcodebuild \
            -workspace Moodle.xcworkspace \
            -scheme Moodle \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee /tmp/xcodebuild.log

      - name: Locate and upload .app to BrowserStack
        script: |
          APP_PATH=$(find platforms/ios/build -name "*.app" \
            -not -name "*.app.dSYM" | head -1)
          echo "Uploading: $APP_PATH"
          curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_TOKEN" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@$APP_PATH"

    artifacts:
      - platforms/ios/build/**/*.app
      - /tmp/xcodebuild.log
