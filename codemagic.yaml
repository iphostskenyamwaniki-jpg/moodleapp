workflows:
  ios-browserstack:
    name: Moodle App - iOS IPA + BrowserStack
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      node: 18.18.2
      vars:
        BROWSERSTACK_USERNAME: "paulmwaniki_cvubBk"
        BROWSERSTACK_ACCESS_TOKEN: "GnDb7oSPmJx1RNDJNy2x"
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Check Node version
        script: |
          node -v && npm -v

      - name: Bypass engine check
        script: |
          sed -i '' 's/engine-strict=true/engine-strict=false/g' .npmrc || true
          npm config set engine-strict false

      - name: Install dependencies
        script: |
          npm ci

      - name: Install Ionic + Cordova CLIs
        script: |
          npm install -g @ionic/cli cordova

      - name: Build cordova-plugin-moodleapp
        script: |
          npm run prod --prefix cordova-plugin-moodleapp

      - name: Clean stale Cordova artefacts
        script: |
          rm -rf platforms plugins .angular www

      - name: Full iOS build (Angular + Cordova + xcodebuild)
        script: |
          # This single command does everything:
          # 1. Runs gulp to generate www/
          # 2. Runs Angular prod build
          # 3. Adds iOS platform if needed
          # 4. Runs pod install
          # 5. Compiles the native Xcode project
          NODE_ENV=production npx ionic cordova build ios \
            --prod \
            --emulator \
            --verbose \
            2>&1 | tee /tmp/ionic-build.log

          # Verify the binary exists (not just web assets)
          APP=$(find platforms/ios/build -name "Moodle.app" \
            -not -name "*.dSYM" \
            -not -path "*/PlugIns/*" | head -1)
          echo "App: $APP"
          echo "Contents:"
          ls "$APP/"
          test -f "$APP/Info.plist" \
            || (echo "MISSING Info.plist — native compile failed" && exit 1)
          test -f "$APP/Moodle" \
            || (echo "MISSING Moodle binary — native compile failed" && exit 1)
          echo "Binary size: $(du -sh "$APP/Moodle")"

      - name: Package .app into .ipa
        script: |
          APP=$(find platforms/ios/build -name "Moodle.app" \
            -not -name "*.dSYM" \
            -not -path "*/PlugIns/*" | head -1)
          echo "Packaging: $APP ($(du -sh "$APP" | cut -f1))"

          rm -rf /tmp/ipawork
          mkdir -p /tmp/ipawork/Payload
          cp -r "$APP" /tmp/ipawork/Payload/Moodle.app

          cd /tmp/ipawork
          zip -r /tmp/Moodle.ipa Payload
          ls -lh /tmp/Moodle.ipa

      - name: Upload IPA to BrowserStack App Live
        script: |
          RESPONSE=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_TOKEN" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@/tmp/Moodle.ipa")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "app_url" \
            || (echo "Upload failed" && exit 1)

    artifacts:
      - /tmp/Moodle.ipa
      - /tmp/ionic-build.log
