workflows:
  ios-browserstack:
    name: Moodle App - iOS IPA + BrowserStack
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      node: 18.18.2
      vars:
        BROWSERSTACK_USERNAME: "paulmwaniki_cvubBk"
        BROWSERSTACK_ACCESS_TOKEN: "GnDb7oSPmJx1RNDJNy2x"
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Check Node version
        script: |
          node -v && npm -v

      - name: Bypass engine check
        script: |
          sed -i '' 's/engine-strict=true/engine-strict=false/g' .npmrc || true
          npm config set engine-strict false

      - name: Install dependencies
        script: |
          npm ci

      - name: Install Ionic + Cordova CLIs
        script: |
          npm install -g @ionic/cli cordova

      - name: Build cordova-plugin-moodleapp
        script: |
          npm run prod --prefix cordova-plugin-moodleapp

      - name: Run gulp (generate www/)
        script: |
          NODE_ENV=production npx gulp

      - name: Clean stale Cordova artefacts
        script: |
          rm -rf platforms plugins .angular

      - name: Add iOS platform with full verbose output
        script: |
          # Run with --verbose so we see the REAL error inside cordova platform add
          npx cordova platform add ios --verbose 2>&1 | tee /tmp/cordova-platform-add.log
          echo "Exit code: ${PIPESTATUS[0]}"

          # If it failed, print the full log and exit
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== FULL CORDOVA LOG ==="
            cat /tmp/cordova-platform-add.log
            exit 1
          fi

      - name: CocoaPods install
        script: |
          cd platforms/ios && pod install --repo-update 2>&1 | tee /tmp/pod-install.log

      - name: Build iOS (xcodebuild)
        script: |
          cd platforms/ios
          xcodebuild \
            -workspace Moodle.xcworkspace \
            -scheme Moodle \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee /tmp/xcodebuild.log

          APP=$(find build -name "Moodle.app" \
            -not -name "*.dSYM" \
            -not -path "*/PlugIns/*" | head -1)
          echo "App: $APP"
          ls "$APP/"
          test -f "$APP/Info.plist" && echo "Info.plist: OK" \
            || (echo "MISSING Info.plist" && exit 1)
          test -f "$APP/Moodle" && echo "Binary: OK" \
            || (echo "MISSING binary" && exit 1)

      - name: Package .app into .ipa
        script: |
          APP=$(find platforms/ios/build -name "Moodle.app" \
            -not -name "*.dSYM" \
            -not -path "*/PlugIns/*" | head -1)
          echo "Packaging: $APP"

          rm -rf /tmp/ipawork
          mkdir -p /tmp/ipawork/Payload
          cp -r "$APP" /tmp/ipawork/Payload/Moodle.app

          cd /tmp/ipawork
          zip -r /tmp/Moodle.ipa Payload
          ls -lh /tmp/Moodle.ipa
          unzip -l /tmp/Moodle.ipa | grep "Info.plist"

      - name: Upload IPA to BrowserStack App Live
        script: |
          RESPONSE=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_TOKEN" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@/tmp/Moodle.ipa")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "app_url" \
            || (echo "Upload failed" && exit 1)

    artifacts:
      - /tmp/Moodle.ipa
      - /tmp/cordova-platform-add.log
      - /tmp/pod-install.log
      - /tmp/xcodebuild.log
