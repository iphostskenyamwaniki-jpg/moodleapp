workflows:
  ios-simulator-browserstack:
    name: Moodle App - Build + BrowserStack
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BROWSERSTACK_USERNAME: "paulmwaniki_cvubBk"
        BROWSERSTACK_ACCESS_TOKEN: "GnDb7oSPmJx1RNDJNy2x"
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install correct Node version (22.x)
        script: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install 22.17
          nvm use 22.17
          node -v
          npm -v

      - name: Install dependencies
        script: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 22.17
          npm ci

      - name: Build Moodle web app
        script: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 22.17
          npx gulp
          npm run build:prod

      - name: Capacitor sync iOS
        script: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 22.17
          npx cap sync ios

      - name: Build for simulator (no signing)
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ios/output \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload .app to BrowserStack App Live
        script: |
          APP_PATH=$(find ios/output/Build/Products/Debug-iphonesimulator -name "*.app" | head -1)
          echo "Uploading: $APP_PATH"
          curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_TOKEN" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@$APP_PATH"

    artifacts:
      - ios/output/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
