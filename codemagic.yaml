workflows:
  ios-simulator-browserstack:
    name: Moodle App - Build + BrowserStack
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BROWSERSTACK_USERNAME: "paulmwaniki_cvubBk"
        BROWSERSTACK_ACCESS_TOKEN: "GnDb7oSPmJx1RNDJNy2x"
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Check Node version
        script: |
          node -v
          npm -v

      - name: Bypass engine check
        script: |
          sed -i '' 's/engine-strict=true/engine-strict=false/g' .npmrc
          npm config set engine-strict false
          echo "=== .npmrc contents ==="
          cat .npmrc

      - name: Install dependencies
        script: |
          npm ci

      - name: Install Cordova
        script: |
          npm install -g cordova

      - name: Build Moodle web app
        script: |
          npx gulp

      - name: Add iOS Cordova platform
        script: |
          cordova platform add ios

      - name: Build iOS for simulator (no signing)
        script: |
          cordova build ios --emulator --debug \
            --buildConfig='{"ios":{"debug":{"codeSignIdentity":"","developmentTeam":"","packageType":"development"}}}' \
            || cordova build ios --emulator --debug

      - name: Upload .app to BrowserStack App Live
        script: |
          APP_PATH=$(find platforms/ios/build -name "*.app" | head -1)
          echo "Uploading: $APP_PATH"
          curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_TOKEN" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@$APP_PATH"

    artifacts:
      - platforms/ios/build/**/*.app
      - /tmp/xcodebuild_logs/*.log
