workflows:
  ios-browserstack:
    name: Moodle App - iOS IPA + BrowserStack
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: 16.3
      cocoapods: default
      node: 18.18.2
      vars:
        BROWSERSTACK_USERNAME: "paulmwaniki_cvubBk"
        BROWSERSTACK_ACCESS_TOKEN: "GnDb7oSPmJx1RNDJNy2x"
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Check Node version
        script: |
          node -v && npm -v
          xcodebuild -version

      - name: Bypass engine check
        script: |
          sed -i '' 's/engine-strict=true/engine-strict=false/g' .npmrc || true
          npm config set engine-strict false

      - name: Install dependencies
        script: |
          npm ci

      - name: Install Ionic + Cordova CLIs
        script: |
          npm install -g @ionic/cli cordova

      - name: Build cordova-plugin-moodleapp
        script: |
          npm run prod --prefix cordova-plugin-moodleapp

      - name: Run gulp (generate www/)
        script: |
          NODE_ENV=production npx gulp

      - name: Clean stale Cordova artefacts
        script: |
          rm -rf platforms plugins .angular

      - name: Enable Cordova integration and add iOS platform
        script: |
          ionic integrations enable cordova --quiet || true
          npx ionic cordova platform add ios \
            --confirm \
            --no-interactive \
            --noresources \
            2>&1 | tee /tmp/platform-add.log

      - name: Patch Podfile — raise all pod targets to iOS 15
        script: |
          python3 -c "
          patch = '''
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                current = config.build_settings['IPHONEOS_DEPLOYMENT_TARGET']
                if current && current.to_f < 15.0
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                end
              end
            end
          end
          '''
          with open('platforms/ios/Podfile', 'a') as f:
              f.write(patch)
          print('Podfile patched successfully')
          "
          tail -20 platforms/ios/Podfile

      - name: CocoaPods install
        script: |
          cd platforms/ios && pod install --repo-update 2>&1 | tee /tmp/pod-install.log

      - name: Build iOS (simulator, no signing)
        script: |
          cd platforms/ios
          xcodebuild \
            -workspace Moodle.xcworkspace \
            -scheme Moodle \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee /tmp/xcodebuild.log

          APP=$(find build -name "Moodle.app" \
            -not -name "*.dSYM" \
            -not -path "*/PlugIns/*" | head -1)
          echo "App: $APP"
          ls "$APP/"
          test -f "$APP/Info.plist" && echo "Info.plist: OK" \
            || (echo "MISSING Info.plist" && exit 1)
          test -f "$APP/Moodle" && echo "Binary: OK" \
            || (echo "MISSING Moodle binary" && exit 1)
          du -sh "$APP"

      - name: Package .app into .ipa
        script: |
          APP=$(find platforms/ios/build -name "Moodle.app" \
            -not -name "*.dSYM" \
            -not -path "*/PlugIns/*" | head -1)
          echo "Packaging: $APP ($(du -sh "$APP" | cut -f1))"

          rm -rf /tmp/ipawork
          mkdir -p /tmp/ipawork/Payload
          cp -r "$APP" /tmp/ipawork/Payload/Moodle.app

          cd /tmp/ipawork
          zip -r /tmp/Moodle.ipa Payload
          ls -lh /tmp/Moodle.ipa
          unzip -l /tmp/Moodle.ipa | grep "Info.plist"

      - name: Upload IPA to BrowserStack App Live
        script: |
          RESPONSE=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_TOKEN" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@/tmp/Moodle.ipa")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "app_url" \
            || (echo "Upload failed" && exit 1)

    artifacts:
      - /tmp/Moodle.ipa
      - /tmp/platform-add.log
      - /tmp/pod-install.log
      - /tmp/xcodebuild.log
