workflows:
  ios-simulator-browserstack:
    name: Moodle App - Build + BrowserStack
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      node: 18.18.2        # Moodle app requires Node 18
      vars:
        BROWSERSTACK_USERNAME: "paulmwaniki_cvubBk"
        BROWSERSTACK_ACCESS_TOKEN: "GnDb7oSPmJx1RNDJNy2x"
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Check Node version
        script: |
          node -v
          npm -v

      - name: Bypass engine check
        script: |
          sed -i '' 's/engine-strict=true/engine-strict=false/g' .npmrc || true
          npm config set engine-strict false
          echo "=== .npmrc contents ==="
          cat .npmrc

      - name: Install dependencies
        script: |
          npm ci

      - name: Install Ionic + Cordova CLIs
        script: |
          npm install -g @ionic/cli cordova

      - name: Clean stale build artefacts
        script: |
          # Official Moodle troubleshooting: delete these before every build
          rm -rf www platforms plugins .angular

      - name: Build cordova-plugin-moodleapp
        script: |
          # Required before prod:ios per package.json
          npm run prod --prefix cordova-plugin-moodleapp

      - name: Build iOS (ionic cordova — handles gulp + platform add internally)
        script: |
          # Uses the same command as npm run prod:ios in package.json
          # ionic cordova run ios --prod runs gulp, adds the platform, builds — all in one
          NODE_ENV=production npx ionic cordova build ios \
            --prod \
            --emulator \
            -- \
            --buildConfig='{"ios":{"debug":{"codeSignIdentity":"","developmentTeam":"","packageType":"development"}}}'

      - name: Upload .app to BrowserStack App Live
        script: |
          APP_PATH=$(find platforms/ios/build -name "*.app" -not -name "*.app.dSYM" | head -1)
          echo "Uploading: $APP_PATH"
          curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_TOKEN" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@$APP_PATH"

    artifacts:
      - platforms/ios/build/**/*.app
      - /tmp/xcodebuild_logs/*.log
