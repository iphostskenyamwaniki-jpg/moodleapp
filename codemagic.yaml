workflows:
  ios-browserstack:
    name: Moodle App - iOS IPA + BrowserStack
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      node: 18.18.2
      vars:
        BROWSERSTACK_USERNAME: "paulmwaniki_cvubBk"
        BROWSERSTACK_ACCESS_TOKEN: "GnDb7oSPmJx1RNDJNy2x"
    cache:
      cache_paths:
        - $HOME/.npm
        - node_modules
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Check Node version
        script: |
          node -v
          npm -v

      - name: Bypass engine check
        script: |
          sed -i '' 's/engine-strict=true/engine-strict=false/g' .npmrc || true
          npm config set engine-strict false

      - name: Install dependencies
        script: |
          npm ci

      - name: Install Ionic + Cordova CLIs
        script: |
          npm install -g @ionic/cli cordova

      - name: Build cordova-plugin-moodleapp
        script: |
          npm run prod --prefix cordova-plugin-moodleapp

      - name: Run gulp (generate www/)
        script: |
          NODE_ENV=production npx gulp

      - name: Clean stale Cordova artefacts
        script: |
          rm -rf platforms plugins .angular

      - name: Add iOS platform
        script: |
          ionic cordova platform remove ios --nosave || true
          ionic cordova platform add ios \
            --confirm \
            --no-interactive \
            --noresources

      - name: CocoaPods install
        script: |
          cd platforms/ios
          pod install --repo-update

      - name: Build iOS .app (device, no signing)
        script: |
          cd platforms/ios
          xcodebuild \
            -workspace Moodle.xcworkspace \
            -scheme Moodle \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee /tmp/xcodebuild.log

      - name: Package .app into .ipa
        script: |
          APP_PATH=$(find platforms/ios/build -name "Moodle.app" \
            -not -name "*.dSYM" | head -1)
          echo "Found app: $APP_PATH"

          mkdir -p /tmp/Payload
          cp -r "$APP_PATH" /tmp/Payload/Moodle.app
          cd /tmp
          zip -r Moodle.ipa Payload
          echo "IPA created at /tmp/Moodle.ipa"

      - name: Upload IPA to BrowserStack App Live
        script: |
          curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_TOKEN" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@/tmp/Moodle.ipa"

    artifacts:
      - /tmp/Moodle.ipa
      - /tmp/xcodebuild.log
